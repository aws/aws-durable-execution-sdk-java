AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Durable Execution Conformance Test Examples - Java (OTel, invocation + execution views,
  all backends). Ported from the otel-invocation/otel-execution examples in
  aws/aws-durable-execution-conformance-tests: full suite (view) and backend parity with the
  upstream Java example project (X-Ray, Dash0, Datadog, S3 collector), deployed as one stack
  per backend by otel-conformance-tests.yml.

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: Pre-created execution role for the test functions
  OtelLayerArn:
    Type: String
    Description: OpenTelemetry Lambda layer ARN (ADOT for X-Ray, community layer for Dash0/Datadog/collector)
  OtelCollectorLayerArn:
    Type: String
    Default: ""
    Description: Optional OpenTelemetry Collector Lambda extension layer (S3 collector backend only)
  OtelCollectorBucket:
    Type: String
    Default: ""
    Description: S3 bucket where the collector writes OTLP trace objects
  OtelCollectorPrefix:
    Type: String
    Default: ""
    Description: S3 key prefix where the collector writes OTLP trace objects
  OtelExecWrapper:
    Type: String
    Default: /opt/otel-instrument
    Description: OpenTelemetry Java agent execution wrapper
  OtelServiceName:
    Type: String
    Default: durable-execution-conformance
    Description: OpenTelemetry resource service name
  OtelTracesExporter:
    Type: String
    Default: otlp
    Description: OpenTelemetry traces exporter selected by the runner
  OtelExporterEndpoint:
    Type: String
    Default: ""
    Description: Non-secret OTLP endpoint used by community exporters (Dash0/Datadog/collector)
  OtelExporterHeaders:
    Type: String
    Default: ""
    NoEcho: true
    Description: Secret OTLP exporter headers supplied by the runner (Dash0/Datadog)

Conditions:
  HasOtelCollectorLayer: !Not [!Equals [!Ref OtelCollectorLayerArn, ""]]
  HasOtelExporterEndpoint: !Not [!Equals [!Ref OtelExporterEndpoint, ""]]
  HasOtelExporterHeaders: !Not [!Equals [!Ref OtelExporterHeaders, ""]]

Globals:
  Function:
    Runtime: java21
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 1024
    Tracing: Active
    Layers: !If
      - HasOtelCollectorLayer
      - [!Ref OtelLayerArn, !Ref OtelCollectorLayerArn]
      - [!Ref OtelLayerArn]
    DurableConfig:
      ExecutionTimeout: 300
      RetentionPeriodInDays: 1
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: !Ref OtelExecWrapper
        JAVA_TOOL_OPTIONS: "-Dotel.javaagent.extensions=/var/task/lib/otel-plugin-extension.jar"
        OTEL_JAVAAGENT_EXTENSIONS: /var/task/lib/otel-plugin-extension.jar
        OTEL_SERVICE_NAME: !Ref OtelServiceName
        OTEL_TRACES_EXPORTER: !Ref OtelTracesExporter
        OTEL_EXPORTER_OTLP_ENDPOINT: !If
          - HasOtelExporterEndpoint
          - !Ref OtelExporterEndpoint
          - !Ref "AWS::NoValue"
        OTEL_EXPORTER_OTLP_HEADERS: !If
          - HasOtelExporterHeaders
          - !Ref OtelExporterHeaders
          - !Ref "AWS::NoValue"
        OTEL_EXPORTER_OTLP_PROTOCOL: !If [HasOtelExporterEndpoint, http/protobuf, grpc]
        OTEL_PROPAGATORS: xray
        OTEL_S3_BUCKET: !Ref OtelCollectorBucket
        OTEL_S3_PREFIX: !Ref OtelCollectorPrefix
        OPENTELEMETRY_COLLECTOR_CONFIG_URI: !If
          - HasOtelCollectorLayer
          - /opt/collector-config/config-s3.yaml
          - !Ref "AWS::NoValue"

Resources:
  Otel1Success:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription:
        - otel-invocation-1
    Properties:
      CodeUri: .
      Handler: software.amazon.lambda.durable.conformance.otel.Otel1Success
      Role: !Ref LambdaExecutionRoleArn

