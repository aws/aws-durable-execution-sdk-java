AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Java (DAG)

Parameters:
  Architecture:
    Type: String
    Default: arm64
    Description: Lambda Function Architecture
    AllowedValues:
      - x86_64
      - arm64
  JavaVersion:
    Type: String
    Default: 'java21'
    Description: Java runtime version

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime:
      Ref: JavaVersion
    Architectures:
      - Ref: Architecture

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            - lambda:InvokeFunction
            Resource: '*'

  DagDiamond:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
    Properties:
      CodeUri: .
      Handler: dag.DagDiamond
      Description: DAG diamond fan-out/fan-in (all tasks complete)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagCompensation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Properties:
      CodeUri: .
      Handler: dag.DagCompensation
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRunIf:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Properties:
      CodeUri: .
      Handler: dag.DagRunIf
      Description: DAG per-task conditional execution (runIf)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagWaitResume:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Properties:
      CodeUri: .
      Handler: dag.DagWaitResume
      Description: DAG in-graph Wait task (suspend and resume)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagChild:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-5"]
    Properties:
      CodeUri: .
      Handler: dag.DagChild
      Description: DAG task that is a runInChildContext (flat child container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagMap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-6"]
    Properties:
      CodeUri: .
      Handler: dag.DagMap
      Description: DAG task that is a map over a fixed item list (flat map container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagParallel:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-7"]
    Properties:
      CodeUri: .
      Handler: dag.DagParallel
      Description: DAG task that is a parallel of two named branches (flat parallel container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagWaitForCondition:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-8"]
    Properties:
      CodeUri: .
      Handler: dag.DagWaitForCondition
      Description: DAG task that is a waitForCondition (flat WaitForCondition op)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-9"]
    Properties:
      CodeUri: .
      Handler: dag.DagNested
      Description: DAG task that is itself a nested DAG / sub-dag (flat nested Dag container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  # Target Functions

  TargetEcho:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: invoke.TargetEcho
      Description: Echo target function — returns whatever it receives
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-10"]
    Properties:
      CodeUri: .
      Handler: dag.DagInvoke
      Description: DAG task that is an invoke of another Lambda (flat invoke op)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME:
            Fn::Sub: "${TargetEcho.Arn}:$LATEST"

  DagCallback:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-11"]
    Properties:
      CodeUri: .
      Handler: dag.DagCallback
      Description: DAG task that is a callback / wait-for-callback (flat callback container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRunIfAbort:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-12"]
    Properties:
      CodeUri: .
      Handler: dag.DagRunIfAbort
      Description: DAG runIf abort path — throwing predicate aborts the DAG with a typed error (execution FAILS)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentOverlap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-13"]
    Properties:
      CodeUri: .
      Handler: dag.DagConcurrentOverlap
      Description: DAG real overlap inside one invocation (maxConcurrency unset; peak concurrency instrumented)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentSuspend:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-14"]
    Properties:
      CodeUri: .
      Handler: dag.DagConcurrentSuspend
      Description: DAG inverted readiness across a suspend (two in-flight waits; maxConcurrency unset)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagLargePayload:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-15"]
    Properties:
      CodeUri: .
      Handler: dag.DagLargePayload
      Description: DAG large aggregate result offloaded and replayed across a suspend (digest round-trips intact)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-16"]
    Properties:
      CodeUri: .
      Handler: dag.DagRetry
      Description: DAG per-task retry — a flaky task retries and succeeds, its result flows downstream (ALL_COMPLETED)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
