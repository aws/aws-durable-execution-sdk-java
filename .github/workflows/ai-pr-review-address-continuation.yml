name: AI PR Review Address Continuation

on:
  workflow_run:
    workflows:
      - AI PR Review Address
    types: [completed]

permissions: {}

jobs:
  address:
    if: >-
      github.event.workflow_run.event ==
        'pull_request_review_comment' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review-address.yml@8de63fa646c1b7b778829126cf53b7874074795e
    with:
      source-run-id: >-
        ${{ format('{0}', github.event.workflow_run.id || '') }}
      source-run-attempt: >-
        ${{ format('{0}', github.event.workflow_run.run_attempt || '') }}
    secrets: inherit
