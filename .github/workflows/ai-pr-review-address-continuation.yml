name: AI PR Review Address Continuation

on:
  workflow_run:
    workflows:
      - AI PR Review Address
    types: [completed]

permissions: {}

# Stays on GitHub-hosted runners: the reusable workflow's codex-issue-worker job
# allows 140 minutes and the CodeBuild project's job limit is 60.
jobs:
  address:
    if: >-
      github.event.workflow_run.event ==
        'pull_request_review_comment' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review-address.yml@d901b2f1a50731f46bb791b7cae6cbe7f56ae917
    with:
      source-run-id: >-
        ${{ format('{0}', github.event.workflow_run.id || '') }}
      source-run-attempt: >-
        ${{ format('{0}', github.event.workflow_run.run_attempt || '') }}
    secrets: inherit
