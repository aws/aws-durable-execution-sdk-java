name: AI Issue Implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Authorized issue number to implement
        required: true
        type: string

permissions: {}

# Stays on GitHub-hosted runners: the reusable workflow's codex-issue-worker job
# allows 140 minutes and the CodeBuild project's job limit is 60.
jobs:
  implement:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-issue-implementation.yml@8ea82196db65b5b0dd67f0b72bb03fa2fa9cf65b # v0.4.0
    with:
      issue-number: ${{ inputs['issue-number'] || '' }}
    secrets: inherit
