name: AI Issue Implementation

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Authorized issue number to implement
        required: true
        type: string

permissions: {}

jobs:
  implement:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-issue-implementation.yml@8de63fa646c1b7b778829126cf53b7874074795e
    with:
      issue-number: ${{ inputs['issue-number'] || '' }}
    secrets: inherit
