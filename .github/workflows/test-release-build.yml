name: Release build tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish_maven.yml'
      - '.github/workflows/test-release-build.yml'
      - '.github/scripts/maven_publish.sh'
      - '.github/scripts/set_release_timestamp.sh'
      - '.github/scripts/test_release_timestamp.py'
      - '.github/scripts/package_release_bundles.py'
      - '.github/scripts/test_release_bundles.py'
      - 'pom.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_maven.yml'
      - '.github/workflows/test-release-build.yml'
      - '.github/scripts/maven_publish.sh'
      - '.github/scripts/set_release_timestamp.sh'
      - '.github/scripts/test_release_timestamp.py'
      - '.github/scripts/package_release_bundles.py'
      - '.github/scripts/test_release_bundles.py'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: corretto
          cache: maven
      - name: Test release timestamp and Javadoc reproducibility
        run: python3 .github/scripts/test_release_timestamp.py

  release-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Maven release bundles
        run: python3 .github/scripts/test_release_bundles.py
