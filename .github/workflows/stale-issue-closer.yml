name: Stale Issue Closer

on:
  schedule:
    # GitHub may delay or drop scheduled workflows during high-load periods.
    # Avoid scheduling at the top of the hour.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale:
    permissions:
      contents: read
      issues: write
    uses: aws/aws-durable-execution-ci/.github/workflows/stale-issue-closer.yml@8ea82196db65b5b0dd67f0b72bb03fa2fa9cf65b # v0.4.0
    with:
      # CodeBuild-hosted runner in the Java testing account; the label must
      # match the CodeBuild project name.
      runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
