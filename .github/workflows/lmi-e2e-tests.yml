name: LMI E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'lmi-tests/**'
      - 'sdk/src/test/java/software/amazon/lambda/durable/execution/LmiLifecycleRegressionTest.java'
      - '.github/workflows/lmi-e2e-tests.yml'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  id-token: write

# The existing dedicated capacity provider is shared; serialize use and janitor runs.
concurrency:
  group: java-lmi-e2e
  cancel-in-progress: false

jobs:
  cloud:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]' &&
       contains(github.event.pull_request.labels.*.name, 'run-lmi-e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fixture: [default1, default2, default8, fixed2, nested2]
    env:
      LMI_FIXTURE: ${{ matrix.fixture }}
      CAPACITY_PROVIDER_ARN: ${{ secrets.CAPACITY_PROVIDER_ARN }}
      TEST_LAMBDA_EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CAPACITY_PROVIDER_ARN"
          test -n "$TEST_LAMBDA_EXECUTION_ROLE_ARN"
          region=$(cut -d: -f4 <<< "$CAPACITY_PROVIDER_ARN")
          echo "AWS_REGION=$region" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: java-lmi-e2e
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - name: Build commit under test and validate evidence assertions
        timeout-minutes: 10
        run: |
          mvn -B -q -pl lmi-tests -am package
          mvn -B -q -pl lmi-tests -am spotless:check
          python3 -m unittest discover -s lmi-tests/tests -v
      - name: Provision and verify LMI configuration
        timeout-minutes: 18
        run: >-
          python3 lmi-tests/cloud_suite.py deploy
          --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${LMI_FIXTURE}"
          --fixture "$LMI_FIXTURE"
      - name: LMI cloud regression assertions (expected red until issue 726 is fixed)
        timeout-minutes: 30
        run: python3 -u lmi-tests/cloud_suite.py test --cloud-enabled
      - name: Collect histories and lifecycle evidence
        if: always()
        timeout-minutes: 5
        run: |
          if test -f lmi-tests/artifacts/manifest.json; then
            python3 lmi-tests/cloud_suite.py collect
          fi
      - name: Delete test-owned resources
        if: always()
        timeout-minutes: 10
        run: python3 lmi-tests/cloud_suite.py cleanup
      - name: Publish failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lmi-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.fixture }}
          retention-days: 7
          path: |
            lmi-tests/artifacts/
            lmi-tests/target/surefire-reports/
            sdk/target/surefire-reports/
      - name: Summarize outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('lmi-tests/artifacts/junit.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('LMI tests assert the fixed behavior in #726; failures are not expected-success results.\n\n')
              if p.exists():
                  for case in ET.parse(p).getroot().findall('testcase'):
                      failures = list(case)
                      state = 'PASS' if not failures else failures[0].get('type', 'FAIL')
                      out.write(f"- {case.get('name')}: {state}\n")
              else:
                  out.write('Cloud assertions did not run. Inspect setup errors in the artifacts.\n')
          PY

  janitor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITY_PROVIDER_ARN: ${{ secrets.CAPACITY_PROVIDER_ARN }}
    steps:
      - uses: actions/checkout@v7
      - name: Select provider region
        run: |
          echo "AWS_REGION=$(cut -d: -f4 <<< "$CAPACITY_PROVIDER_ARN")" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TEST_ROLE_ARN }}
          role-session-name: java-lmi-janitor
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.TEST_ACCOUNT_ID }}
      - name: Remove suite-owned resources older than six hours
        run: python3 lmi-tests/cloud_suite.py janitor
