name: AI PR Review Address

on:
  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number
        required: true
        type: string

permissions: {}

# Stays on GitHub-hosted runners: the reusable workflow's codex-issue-worker job
# allows 140 minutes and the CodeBuild project's job limit is 60.
jobs:
  intake:
    if: github.event_name == 'pull_request_review_comment'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review-address.yml@d901b2f1a50731f46bb791b7cae6cbe7f56ae917

  address:
    if: >-
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review-address.yml@d901b2f1a50731f46bb791b7cae6cbe7f56ae917
    with:
      pull-request-number: ${{ inputs['pull-request-number'] || '' }}
    secrets: inherit
