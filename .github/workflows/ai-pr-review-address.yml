name: AI PR Review Address

on:
  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Pull request number
        required: true
        type: string

permissions: {}

# Stays on GitHub-hosted runners: the reusable workflow's codex-issue-worker job
# allows 140 minutes and the CodeBuild project's job limit is 60.
jobs:
  intake:
    if: github.event_name == 'pull_request_review_comment'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-work-item-resolver.yml@288e4317948ca778ebf01acca9342d8b898a1dc2
    with:
      work-scope: review
      upload-work-items: true

  address:
    if: >-
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: aws/aws-durable-execution-ci/.github/workflows/ai-pr-review-address.yml@288e4317948ca778ebf01acca9342d8b898a1dc2
    with:
      pull-request-number: ${{ inputs['pull-request-number'] || '' }}
    secrets: inherit
